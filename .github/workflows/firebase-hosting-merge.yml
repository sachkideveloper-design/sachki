name: Deploy a Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Subir versión (cache-busting)
        run: |
          chmod +x bump-version.sh
          ./bump-version.sh
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias de build
        run: npm ci
      - name: Generar dist/ (JS ofuscado)
        run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: app-gimnasio-54470
      - name: Desplegar reglas de Firestore
        # NOTA: storage:rules queda pendiente a propósito. Storage requiere el
        # plan Blaze de Firebase, que este proyecto todavía no tiene activado.
        # storage.rules ya existe en el repo, listo para cuando se active Blaze:
        # solo hay que agregar ",storage:rules" de vuelta en la línea de abajo.
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-sa.json
          npm install -g firebase-tools
          firebase deploy --only firestore:rules --project app-gimnasio-54470 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
          